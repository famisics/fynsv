version: "3"

vars:
  HOST: arona
  REMOTE_DIR: "~"
  REMOTE_GOOS: linux
  REMOTE_GOARCH: amd64

tasks:
  default:
    silent: true
    cmds:
      - task --list

  build:discord-connect:
    desc: discord-bot/connect をビルドする (.output を生成)
    dir: "{{.ROOT_DIR}}/discord-bot/connect"
    cmds:
      - nr build

  build:misskey-mixi2-link:
    internal: true
    dir: "{{.ROOT_DIR}}"
    cmds:
      - GOOS={{.REMOTE_GOOS}} GOARCH={{.REMOTE_GOARCH}} CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/misskey-mixi2-link/bridge ./misskey-mixi2-link

  deploy:misskey-mixi2-link:
    desc: misskey-mixi2-link をローカルでビルドし、arona に転送・再起動する
    deps: [build:misskey-mixi2-link]
    cmds:
      - COPYFILE_DISABLE=1 tar czf - -C {{.ROOT_DIR}} --no-xattrs --no-mac-metadata dist/misskey-mixi2-link/bridge misskey-mixi2-link/Dockerfile misskey-mixi2-link/compose.yml misskey-mixi2-link/.env | ssh {{.HOST}} "mkdir -p {{.REMOTE_DIR}} && tar xzf - -C {{.REMOTE_DIR}}"
      - ssh {{.HOST}} "cd {{.REMOTE_DIR}}/misskey-mixi2-link && docker compose up -d --build"

  build:swarm-gcal-sync:
    internal: true
    dir: "{{.ROOT_DIR}}"
    cmds:
      - GOOS={{.REMOTE_GOOS}} GOARCH={{.REMOTE_GOARCH}} CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/swarm-gcal-sync/sync ./swarm-gcal-sync

  deploy:swarm-gcal-sync:
    desc: swarm-gcal-sync をローカルでビルドし、arona に転送・再起動する
    deps: [build:swarm-gcal-sync]
    cmds:
      - COPYFILE_DISABLE=1 tar czf - -C {{.ROOT_DIR}} --no-xattrs --no-mac-metadata dist/swarm-gcal-sync/sync swarm-gcal-sync/Dockerfile swarm-gcal-sync/compose.yml swarm-gcal-sync/.env swarm-gcal-sync/secrets | ssh {{.HOST}} "mkdir -p {{.REMOTE_DIR}} && tar xzf - -C {{.REMOTE_DIR}}"
      - ssh {{.HOST}} "cd {{.REMOTE_DIR}}/swarm-gcal-sync && docker compose up -d --build"

  backfill:swarm-gcal-sync:
    desc: arona 上で swarm-gcal-sync に過去の全チェックインを取り込ませる (一度だけ実行)
    cmds:
      - ssh {{.HOST}} "cd {{.REMOTE_DIR}}/swarm-gcal-sync && docker compose run --rm sync -backfill"

  deploy:all:
    desc: 全てのサービスをローカルでビルドし、arona に転送・再起動する
    deps: [deploy:misskey-mixi2-link, deploy:swarm-gcal-sync]
