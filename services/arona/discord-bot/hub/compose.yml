services:
  hub:
    build: .
    restart: unless-stopped
    env_file: .env
    # cloudflared (arona のホスト上) から localhost で繋ぐ。LAN には公開しない。
    # ポートは .env の PORT と揃える
    ports:
      - "127.0.0.1:8091:8091"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:8091/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
