version: "3"

vars:
  HOST: arona
  REMOTE_DIR: "~/discord-bot/connect"

tasks:
  default:
    silent: true
    cmds:
      - task --list

  deploy:
    desc: ビルドし、arona に転送・再起動する
    cmds:
      - nr build
      - COPYFILE_DISABLE=1 tar czf - --no-xattrs --no-mac-metadata Dockerfile compose.yml .env .output | ssh {{.HOST}} "mkdir -p {{.REMOTE_DIR}} && rm -rf {{.REMOTE_DIR}}/.output && tar xzf - -C {{.REMOTE_DIR}}"
      - ssh {{.HOST}} "cd {{.REMOTE_DIR}} && docker compose up -d --build"
