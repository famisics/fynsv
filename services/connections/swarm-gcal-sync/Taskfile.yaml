version: "3"

vars:
  HOST: arona
  REMOTE_DIR: "~/swarm-gcal-sync"

tasks:
  default:
    silent: true
    cmds:
      - task --list

  deploy:
    desc: swarm-gcal-sync を arona に転送してビルド・再起動する
    cmds:
      - COPYFILE_DISABLE=1 tar czf - -C {{.ROOT_DIR}} --no-xattrs --no-mac-metadata go.mod go.sum *.go Dockerfile compose.yml .env secrets | ssh {{.HOST}} "mkdir -p {{.REMOTE_DIR}} && tar xzf - -C {{.REMOTE_DIR}}"
      - ssh {{.HOST}} "cd {{.REMOTE_DIR}} && docker compose up -d --build"

  backfill:
    desc: arona 上で過去の全チェックインを取り込む (一度だけ実行)
    cmds:
      - ssh {{.HOST}} "cd {{.REMOTE_DIR}} && docker compose run --rm sync -backfill"
