version: "3"

vars:
  HOST: arona
  REMOTE_DIR: "~/misskey-mixi2-link"

tasks:
  default:
    silent: true
    cmds:
      - task --list

  deploy:
    desc: misskey-mixi2-link を arona に転送してビルド・再起動する
    cmds:
      - COPYFILE_DISABLE=1 tar czf - -C {{.ROOT_DIR}} --no-xattrs --no-mac-metadata package.json bun.lock tsconfig.json src Dockerfile compose.yml .env | ssh {{.HOST}} "mkdir -p {{.REMOTE_DIR}} && tar xzf - -C {{.REMOTE_DIR}}"
      - ssh {{.HOST}} "cd {{.REMOTE_DIR}} && docker compose up -d --build"
